name: CJ pro šup
# Paralelně: každý obchod / každé cenové pásmo Answearu a Allegra ve vlastní úloze (vlastní limit), výsledky jako artefakty.
# Do větve cj zapisuje JEN závěrečná úloha „ulozit“ (žádný souběžný force-push). Když úloha selže, zůstane předchozí soubor.
# Ladění bez úprav souboru (Settings → Secrets and variables → Actions → Variables):
#   CJ_PARALLEL   kolik úloh smí běžet najednou (výchozí 8; při častých 403/429 dát 3, krajně 2)
#   CJ_BUDGET_MIN po kolika minutách úloha uloží, co stihla (výchozí 55)
on:
  schedule:
    - cron: '17 1,13 * * *'   # dvakrát denně
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: cj
jobs:
  fetch:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(vars.CJ_PARALLEL || '8') }}
      matrix:
        include:   # pořadí = pořadí spuštění, když CJ_PARALLEL nestačí na všechny
          - { id: ostatni, shops: 'Kabea.cz Meatfly.cz Vivantis.cz Husky Metalshop.cz', slice: '', delay: 0, shop_min: 25 }
          - { id: answear-1, shops: 'Answear.cz', slice: '1/3', delay: 20, shop_min: 55 }
          - { id: answear-2, shops: 'Answear.cz', slice: '2/3', delay: 40, shop_min: 55 }
          - { id: answear-3, shops: 'Answear.cz', slice: '3/3', delay: 60, shop_min: 55 }
          - { id: allegro-1, shops: 'Allegro', slice: '1/8', delay: 5, shop_min: 55 }
          - { id: allegro-2, shops: 'Allegro', slice: '2/8', delay: 20, shop_min: 55 }
          - { id: allegro-3, shops: 'Allegro', slice: '3/8', delay: 35, shop_min: 55 }
          - { id: allegro-4, shops: 'Allegro', slice: '4/8', delay: 50, shop_min: 55 }
          - { id: allegro-5, shops: 'Allegro', slice: '5/8', delay: 0, shop_min: 55 }
          - { id: allegro-6, shops: 'Allegro', slice: '6/8', delay: 15, shop_min: 55 }
          - { id: allegro-7, shops: 'Allegro', slice: '7/8', delay: 30, shop_min: 55 }
          - { id: allegro-8, shops: 'Allegro', slice: '8/8', delay: 45, shop_min: 55 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testy
        run: for t in tests/test_cj*.py; do python "$t" >/dev/null || { python "$t"; exit 1; }; done
      - name: Načíst předchozí soubory (pásma Answearu + když obchod selže, zůstanou)
        run: |
          mkdir -p cache/cj cache/cj-parts
          if git fetch --depth=1 origin cj 2>/dev/null; then git archive origin/cj | tar -x -C cache/cj
          else echo "Větev cj zatím není."; fi
          touch "$RUNNER_TEMP/start"
      - name: Stáhnout ${{ matrix.shops }} ${{ matrix.slice }}
        continue-on-error: true            # i při chybě se nahraje, co se uložilo; ukládací úloha poběží
        env:
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
          CJ_BUDGET_MIN: ${{ vars.CJ_BUDGET_MIN || '55' }}
          CJ_SHOP_BUDGET_MIN: ${{ matrix.shop_min }}
          CJ_JITTER: '45'                  # po 403/429 čekat 60–105 s místo přesně 60 s (úlohy se nerozběhnou najednou)
          CJ_SCHEMA: ${{ matrix.id == 'allegro-1' && '1' || '0' }}
        run: |
          sleep ${{ matrix.delay }}        # rozestup startů, ať první dotazy nepřijdou do CJ ve stejnou chvíli
          python -u scripts/fetch_cj.py ${{ matrix.slice && format('--slice {0}', matrix.slice) || '' }} ${{ matrix.shops }}
      - name: Připravit výsledek (jen nově uložené soubory)
        if: always()
        run: |
          mkdir -p out/shops out/parts
          find cache/cj -maxdepth 1 -name '*.json.gz' -newer "$RUNNER_TEMP/start" -exec cp {} out/shops/ \;
          find cache/cj-parts -name '*.json.gz' -newer "$RUNNER_TEMP/start" -exec cp {} out/parts/ \;
          ls -l out/shops out/parts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cj-${{ matrix.id }}
          path: out/
          if-no-files-found: ignore
          retention-days: 2
          compression-level: 0             # soubory už jsou gzip

  ulozit:
    needs: fetch
    if: ${{ !cancelled() }}                # i když některá úloha selhala – její obchod zůstane z minula
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Načíst předchozí soubory z větve cj
        run: |
          mkdir -p cache/cj cache/cj-parts
          if git fetch --depth=1 origin cj 2>/dev/null; then git archive origin/cj | tar -x -C cache/cj
          else echo "Větev cj zatím není."; fi
      - uses: actions/download-artifact@v4
        with:
          pattern: cj-*
          path: in
          merge-multiple: true
      - name: Přidat nové soubory a poskládat Answear z pásem
        run: |
          ls -lR in 2>/dev/null || true
          if ! ls in/shops/*.json.gz in/parts/*.json.gz >/dev/null 2>&1; then echo "Žádná nová data z CJ, větev cj nechávám."; echo "SKIP=1" >> "$GITHUB_ENV"; exit 0; fi
          cp in/shops/*.json.gz cache/cj/ 2>/dev/null || true      # každý obchod uložila jen jeho úloha → bez kolizí
          cp in/parts/*.json.gz cache/cj-parts/ 2>/dev/null || true
          python -u scripts/fetch_cj.py --assemble Answear.cz Allegro
      - name: Uložit do větve cj (hodinový běh si ji načte)
        if: env.SKIP != '1'
        run: |
          cd cache/cj
          ls *.json.gz >/dev/null 2>&1 || { echo "Bez dat z CJ, nic neukládám."; exit 0; }
          git init -q -b cj
          git config user.name "šup bot"
          git config user.email "actions@users.noreply.github.com"
          git add *.json.gz
          git commit -qm "CJ $(date '+%F %H:%M')"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" cj
