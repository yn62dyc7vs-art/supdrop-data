name: Denní data šupu
on:
  schedule:
    - cron: '23 * * * *'   # každou hodinu (GitHub plánované běhy občas vynechá, takže data jsou vždy čerstvá do 3 hodin)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: denni-data
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Načíst historii cen z větve live
        run: |
          mkdir -p out
          if git fetch --depth=1 origin live 2>/dev/null; then
            if git show origin/live:state.json.gz > out/state.json.gz 2>/dev/null; then echo "STATE_EXPECTED=1" >> "$GITHUB_ENV"
            elif git show origin/live:state.json > out/state.json 2>/dev/null; then rm -f out/state.json.gz; echo "STATE_EXPECTED=1" >> "$GITHUB_ENV"
            else rm -f out/state.json.gz out/state.json; echo "Větev live je bez historie, začínám znovu."; fi
          else echo "Zatím bez historie."; fi
      - name: Načíst Allegro (stahuje se zvlášť jednou denně)
        run: |
          mkdir -p cache
          if git fetch --depth=1 origin allegro 2>/dev/null; then git show origin/allegro:allegro.json.gz > cache/allegro.json.gz || rm -f cache/allegro.json.gz
          else echo "Allegro zatím není."; fi
      - name: Načíst velké katalogy z CJ (stahují se zvlášť dvakrát denně)
        run: |
          mkdir -p cache/cj
          if git fetch --depth=1 origin cj 2>/dev/null; then git archive origin/cj | tar -x -C cache/cj
          else echo "Katalogy z CJ zatím nejsou."; fi
      - name: Načíst výsledek kontroly odkazů (vyřazené obchody)
        run: |
          if git fetch --depth=1 origin kontrola 2>/dev/null; then git show origin/kontrola:linkcheck.json > cache/linkcheck.json || rm -f cache/linkcheck.json
          else echo "Kontrola odkazů zatím neproběhla."; fi
      - name: Stáhnout feedy a sestavit katalog
        env:
          SHOP_FEEDS: ${{ secrets.SHOP_FEEDS }}
          SHOP_FEEDS_DOGNET: ${{ secrets.SHOP_FEEDS_DOGNET }}
          SHOP_FEEDS_EHUB2: ${{ secrets.SHOP_FEEDS_EHUB2 }}
          CJ_TOKEN: ${{ secrets.CJ_TOKEN }}
          AWIN_KEY: ${{ secrets.AWIN_KEY }}
        run: |
          python tests/test_slevy.py
          python tests/test_awin.py
          python tests/test_td.py
          python tests/test_cj.py
          python tests/test_links.py
          python tests/test_off.py
          python tests/test_fallback.py
          python -u scripts/build_catalog.py
      - name: Rozdělit data na malé soubory (rychlý start webu a appky)
        run: python scripts/split_catalog.py
      - name: Zveřejnit data do větve live (web a appka si je načtou samy)
        run: |
          cd out
          rm -f full.json
          find . -type f -size +90M ! -name 'state.json.gz' -print -delete
          test -s state.json.gz || { echo "Chybí historie cen (state.json.gz), nezveřejňuji."; exit 1; }
          git init -q -b live
          git config user.name "šup bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Data $(date +%F)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" live
